<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Images — The Forsaken Light</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="min-h-screen images-page">

    <div class="bg-ornament" aria-hidden="true"></div>

    <div class="relative z-10 max-w-4xl mx-auto px-6">

        <a href="extra.html" class="back-btn">← Kembali ke Extra Content</a>

        <header class="chapter-header extra-header">
            <p class="chapter-eyebrow">Extra Content · 02</p>
            <h1>Images</h1>
            <p class="extra-intro">Kumpulan gambar, artwork, dan visual yang berkaitan dengan The Forsaken Light.</p>
        </header>

        <main class="images-content">
            <p class="section-label">Artworks & Pictures</p>
            <section class="image-gallery">
                <figure class="image-card" data-full="../assets/img/Another_Alter_true_form.jpeg"
                    data-title="Another Alter True Form" data-desc="Another Alter in his true form.">
                    <img src="../assets/img/Another_Alter_true_form.jpeg" alt="another_alter_true_form" loading="lazy">
                    <figcaption>
                        <h2>Another Alter True Form</h2>
                        <p>Another Alter in his true form.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Alter_armor.jpeg" data-title="Alter Armor"
                    data-desc="Alter in his combat armor, dubbed &quot;Model OA&quot;. Omega-Alter is a powerful armor made using Alter's data and his hatred energy.">
                    <img src="../assets/img/Alter_armor.jpeg" alt="alter_model_oa" loading="lazy">
                    <figcaption>
                        <h2>Alter Armor</h2>
                        <p>Alter in his combat armor, dubbed "Model OA". Omega-Alter is a powerful armor made using
                            Alter's data and his hatred energy.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Taufik.jpeg" data-title="Taufik in BlackSpace"
                    data-desc="Taufik is being held in BlackSpace, his soul is contained in a container.">
                    <img src="../assets/img/Taufik.jpeg" alt="taufik" loading="lazy">
                    <figcaption>
                        <h2>Taufik in BlackSpace</h2>
                        <p>Taufik is being held in BlackSpace, his soul is contained in a container.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Taufik_cry.gif" data-title="Taufik crying"
                    data-desc="Taufik is crying in the darkness.">
                    <img src="../assets/img/Taufik_cry.gif" alt="taufik_cry" loading="lazy">
                    <figcaption>
                        <h2>Taufik crying</h2>
                        <p>Taufik is crying in the darkness.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Taufik_breakdown.gif"
                    data-title="Taufik mental breakdown"
                    data-desc="Taufik is being consumed by darkness and having an episode of mental breakdown.">
                    <img src="../assets/img/Taufik_breakdown.gif" alt="taufik_breakdown" loading="lazy">
                    <figcaption>
                        <h2>Taufik mental breakdown</h2>
                        <p>Taufik is being consumed by darkness and having an episode of mental breakdown.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Another_Alter_Offering.png"
                    data-title="Another Alter Offering" data-desc="The darkness offers Alter some kind of truce">
                    <img src="../assets/img/Another_Alter_Offering.png" alt="another_alter_offering" loading="lazy">
                    <figcaption>
                        <h2>Another Alter Offering</h2>
                        <p>The darkness incites Alter to surrender.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Alter_Acceptance.png" data-title="Alter acceptance"
                    data-desc="Alter accepting the darkness in him to fully control him.">
                    <img src="../assets/img/Alter_Acceptance.png" alt="alter_acceptance" loading="lazy">
                    <figcaption>
                        <h2>Alter acceptance</h2>
                        <p>Alter completely embrace the darkness inside him.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Fusing.png" data-title="Fusing"
                    data-desc="Alter fuse, evolving to Another Alter.">
                    <img src="../assets/img/Fusing.png" alt="fusing" loading="lazy">
                    <figcaption>
                        <h2>Fusing</h2>
                        <p>Alter fuse with the darkness, evolving to Another Alter.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Fusion.png" data-title="Fusion"
                    data-desc="The darkness completely take control.">
                    <img src="../assets/img/Fusion.png" alt="fusion" loading="lazy">
                    <figcaption>
                        <h2>Fusion</h2>
                        <p>The darkness is mad...</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Another_Alter.png" data-title="Another Alter"
                    data-desc="Another Alter.">
                    <img src="../assets/img/Another_Alter.png" alt="another_alter" loading="lazy">
                    <figcaption>
                        <h2>Another Alter</h2>
                        <p>Evolusi dari Alter.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Alter.png" data-title="Alter" data-desc="Alter.">
                    <img src="../assets/img/Alter.png" alt="alter" loading="lazy">
                    <figcaption>
                        <h2>Alter</h2>
                        <p>Alter, The Saviour Of The Light.</p>
                    </figcaption>
                </figure>

                <figure class="image-card" data-full="../assets/img/Alter_True_Form.png" data-title="Zenith Alter"
                    data-desc="Alter in his true form.">
                    <img src="../assets/img/Alter_True_Form.png" alt="alter_true_form" loading="lazy">
                    <figcaption>
                        <h2>Zenith Alter</h2>
                        <p>Alter in his true form.</p>
                    </figcaption>
                </figure>

            </section>
        </main>

        <div id="lightbox" class="lightbox" aria-hidden="true">
            <button class="lightbox-close" aria-label="Tutup">&times;</button>
            <figure class="lightbox-content">
                <img id="lightbox-img" src="" alt="">
                <figcaption>
                    <h2 id="lightbox-title"></h2>
                    <p id="lightbox-desc"></p>
                </figcaption>
            </figure>
        </div>
        <nav class="chapter-nav">
            <a href="extra.html" class="nav-btn"> ← Extra Content</a>
        </nav>
        <footer class="relative z-10 text-center pb-10 mt-16">
            <p class="footer-text"> Ditulis dengan ♥ oleh
                <span class="author-name">Alter</span>
            </p>
        </footer>
    </div>

    <script src="../assets/js/script.js"></script>

</body>

</html>
